<style>
  /* ============================================================
     DESIGN TOKENS
     ============================================================ */
  :root{
    --bg: #F7F3EE;
    --panel: #FFFDFB;
    --line: #E4DACF;
    --line-soft: #ECE3D8;
    --text: #2A1F22;
    --muted: #7C6F68;
    --muted-dim: #A99C93;
    --signal: #7C2434;
    --signal-dim: rgba(124, 36, 52, .10);
    --accent2: #B5495A;
    --radius: 3px;
    --font-display: 'Space Grotesk', -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', 'SF Mono', monospace;
    --content-max: 720px;
    --rail-w: 52px;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior: auto; }
    *{ animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }

  body{
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-display);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  /* ============================================================
     BACKGROUND BLOBS — decorative, fixed to viewport, non-interactive
     ============================================================ */
  .bg-blobs{
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
  }
  .blob{ position: absolute; filter: blur(70px); }
  .blob--a{
    width: 46vw; height: 46vw; max-width: 560px; max-height: 560px;
    top: -12vh; right: -10vw;
    background: radial-gradient(circle at 35% 35%, rgba(124,36,52,.22), rgba(124,36,52,0) 70%);
    border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%;
  }
  .blob--b{
    width: 34vw; height: 34vw; max-width: 420px; max-height: 420px;
    bottom: -8vh; left: -8vw;
    background: radial-gradient(circle at 60% 40%, rgba(181,73,90,.20), rgba(181,73,90,0) 70%);
    border-radius: 60% 40% 35% 65% / 55% 45% 55% 45%;
  }
  .blob--c{
    width: 20vw; height: 20vw; max-width: 260px; max-height: 260px;
    top: 38%; right: 4vw;
    background: radial-gradient(circle at 50% 50%, rgba(124,36,52,.15), rgba(124,36,52,0) 70%);
    border-radius: 35% 65% 55% 45% / 40% 60% 40% 60%;
  }

  a{ color: inherit; }
  ::selection{ background: var(--signal); color: #FBEEF1; }

  :focus-visible{
    outline: 2px solid var(--signal);
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* ============================================================
     LAYOUT PRIMITIVES
     ============================================================ */
  .wrap{
    max-width: calc(var(--content-max) + var(--rail-w) + 24px);
    margin: 0 auto;
    padding: 0 20px;
  }

  section{
    display: grid;
    grid-template-columns: var(--rail-w) minmax(0, 1fr);
    gap: 24px;
    padding: 72px 0;
    border-bottom: 1px solid var(--line-soft);
  }
  section:last-of-type{ border-bottom: none; }

  .rail{
    position: relative;
  }
  .rail span{
    position: sticky;
    top: 96px;
    display: inline-block;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: .04em;
    color: var(--muted-dim);
  }

  h2.heading{
    font-size: 13px;
    font-family: var(--font-mono);
    color: var(--muted);
    margin: 0 0 28px;
    font-weight: 400;
  }

  @media (max-width: 640px){
    section{ grid-template-columns: 1fr; padding: 48px 0; }
    .rail{ display: none; }
  }

  /* ============================================================
     HEADER
     ============================================================ */
  header{
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(247,243,238,.86);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line-soft);
  }
  header .wrap{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    height: 64px;
  }
  .brand{
    font-family: var(--font-mono);
    font-size: 15px;
    font-weight: 500;
    text-decoration: none;
    letter-spacing: .02em;
    flex: none;
  }
  .brand em{
    color: var(--signal);
    font-style: normal;
  }
  nav{
    display: flex;
    gap: 28px;
    min-width: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav::-webkit-scrollbar{ display: none; }
  nav a{
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--muted);
    text-decoration: none;
    white-space: nowrap;
    position: relative;
    padding: 4px 0;
  }
  nav a::after{
    content: '';
    position: absolute;
    left: 0; right: 100%;
    bottom: -1px;
    height: 1px;
    background: var(--signal);
    transition: right .2s ease;
  }
  nav a.active{ color: var(--text); }
  nav a.active::after{ right: 0; }

  .header-right{ display: flex; align-items: center; gap: 22px; min-width: 0; flex: 1; justify-content: flex-end; }

  .lang-switch{
    display: flex;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    flex: none;
  }
  .lang-switch button{
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: .03em;
    background: none;
    border: none;
    padding: 6px 10px;
    color: var(--muted);
    cursor: pointer;
  }
  .lang-switch button + button{ border-left: 1px solid var(--line); }
  .lang-switch button.active{ background: var(--signal); color: #FBEEF1; }
  .lang-switch button:hover:not(.active){ color: var(--text); }

  @media (max-width: 560px){
    nav{ gap: 16px; }
    nav a{ font-size: 12px; }
    .header-right{ gap: 14px; }
  }

  /* ============================================================
     HERO / ABOUT
     ============================================================ */
  .about-inner{
    display: flex;
    align-items: flex-start;
  }
  .about-text{ min-width: 0; }

  .name{
    font-size: clamp(28px, 4.4vw, 40px);
    font-weight: 600;
    margin: 0 0 8px;
    letter-spacing: -.01em;
  }
  .meta-line{
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    margin-bottom: 20px;
  }
  .meta-line span:not(:last-child)::after{
    content: '/';
    margin: 0 10px;
    color: var(--muted-dim);
  }
  .bio{
    max-width: 58ch;
    color: var(--text);
    font-size: 16px;
    margin: 0 0 32px;
  }

  .stats{
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
    margin-bottom: 32px;
  }
  .stat{
    border-left: 2px solid var(--signal);
    padding-left: 12px;
  }
  .stat:nth-child(2){ border-left-color: var(--accent2); }
  .stat b{
    display: block;
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 500;
  }
  .stat span{
    display: block;
    font-size: 12.5px;
    color: var(--muted);
    max-width: 16ch;
    margin-top: 2px;
  }

  .cta-row{ display: flex; gap: 12px; flex-wrap: wrap; }
  .btn{
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 11px 18px;
    border-radius: var(--radius);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1px solid transparent;
    transition: border-color .15s ease, background .15s ease;
  }
  .btn--primary{
    background: var(--signal);
    color: #FBEEF1;
    font-weight: 500;
  }
  .btn--primary:hover{ background: #611D2A; }
  .btn--ghost{
    border-color: var(--line);
    color: var(--text);
  }
  .btn--ghost:hover{ border-color: var(--signal); }

  /* load-in sequence: a single orchestrated moment, hero only */
  .about-inner .name,
  .about-inner .meta-line,
  .about-inner .bio,
  .about-inner .stats,
  .about-inner .cta-row{
    opacity: 0;
    animation: rise .5s ease forwards;
  }
  .about-inner .name{ animation-delay: .02s; }
  .about-inner .meta-line{ animation-delay: .14s; }
  .about-inner .bio{ animation-delay: .2s; }
  .about-inner .stats{ animation-delay: .26s; }
  .about-inner .cta-row{ animation-delay: .32s; }
  @keyframes rise{
    from{ opacity: 0; transform: translateY(8px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 560px){
    .about-inner{ flex-direction: column; }
  }

  /* ============================================================
     STACK
     ============================================================ */
  .skill-group{ margin-bottom: 22px; }
  .skill-group:last-child{ margin-bottom: 0; }
  .skill-group-label{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted-dim);
    margin-bottom: 10px;
  }
  .chips{ display: flex; flex-wrap: wrap; gap: 8px; }
  .chip{
    font-family: var(--font-mono);
    font-size: 12.5px;
    padding: 6px 11px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--muted);
    background: var(--panel);
  }

  /* ============================================================
     PROJECTS
     ============================================================ */
  .projects-intro{
    max-width: 58ch;
    color: var(--muted);
    font-size: 15px;
    margin: 0 0 24px;
  }
  .project-grid{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  .project-card{
    display: flex;
    flex-direction: column;
    gap: 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel);
    padding: 18px 18px 16px;
    text-decoration: none;
    transition: border-color .15s ease;
  }
  .project-card:hover{ border-color: var(--signal); }
  .project-card-top{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  .project-lang{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .04em;
    color: var(--signal);
    text-transform: uppercase;
  }
  .project-name{
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    margin: 0;
    word-break: break-word;
  }
  .project-tools{
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    flex: 1;
  }
  .project-tool{
    font-family: var(--font-mono);
    font-size: 11.5px;
    padding: 4px 9px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--muted);
    background: var(--bg);
  }
  .project-link{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }
  .project-card:hover .project-link{ color: var(--signal); }
  @media (max-width: 760px){
    .project-grid{ grid-template-columns: 1fr; }
  }

  /* ============================================================
     EXPERIENCE
     ============================================================ */
  .exp-toolbar{
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 22px;
  }
  .exp-toggle{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .exp-toggle:hover{ color: var(--signal); }

  .exp-item{
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 12px;
    background: var(--panel);
    overflow: hidden;
  }
  .exp-item summary{
    list-style: none;
    cursor: pointer;
    padding: 18px 20px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
  }
  .exp-item summary::-webkit-details-marker{ display: none; }
  .exp-head-left{ min-width: 0; }
  .exp-company{
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 2px;
  }
  .exp-role{
    font-size: 13.5px;
    color: var(--muted);
  }
  .exp-period{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted-dim);
    white-space: nowrap;
    flex: none;
    padding-top: 2px;
  }
  .exp-item[open] summary{ border-bottom: 1px solid var(--line); }
  .exp-item summary .caret{
    display: none;
  }
  .exp-body{
    padding: 4px 20px 20px;
  }
  .exp-body ul{
    margin: 0;
    padding-left: 18px;
  }
  .exp-body li{
    margin-bottom: 8px;
    font-size: 14.5px;
    color: var(--text);
  }
  .exp-body li:last-child{ margin-bottom: 0; }

  @media (max-width: 560px){
    .exp-item summary{ flex-wrap: wrap; row-gap: 6px; }
    .exp-period{ white-space: normal; flex: 1 1 100%; }
  }

  /* ============================================================
     BACKGROUND (education / languages)
     ============================================================ */
  .bg-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
  }
  .bg-block-label{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted-dim);
    margin-bottom: 10px;
  }
  .bg-block p{ margin: 0 0 4px; font-size: 14.5px; }
  .bg-block p.sub{ color: var(--muted); font-size: 13px; }
  @media (max-width: 560px){
    .bg-grid{ grid-template-columns: 1fr; }
  }

  /* ============================================================
     CONTACT
     ============================================================ */
  .contact-intro{
    max-width: 52ch;
    color: var(--muted);
    margin-bottom: 28px;
    font-size: 15px;
  }
  .contact-grid{
    display: flex;
    flex-wrap: wrap;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .contact-card{
    flex: 1 1 180px;
    background: var(--panel);
    padding: 18px 20px;
    text-decoration: none;
    border-left: 1px solid var(--line);
    border-top: 1px solid var(--line);
    margin-left: -1px;
    margin-top: -1px;
    transition: background .15s ease;
  }
  .contact-card:hover{ background: #F1E7DF; }
  .contact-card-label{
    display: block;
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--muted-dim);
    margin-bottom: 6px;
  }
  .contact-card-value{
    display: block;
    font-size: 14.5px;
    color: var(--text);
  }

  footer{
    padding: 32px 0 48px;
  }
  footer .wrap{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted-dim);
  }
</style>
</head>

/* ==================================================================
   RENDERING — reads CONTENT[lang] above and fills the page.
   No edits needed here for normal content changes.
   ================================================================== */
function el(tag, opts = {}, children = []){
  const e = document.createElement(tag);
  if (opts.class) e.className = opts.class;
  if (opts.text) e.textContent = opts.text;
  if (opts.html) e.innerHTML = opts.html;
  if (opts.href) e.href = opts.href;
  if (opts.attrs) for (const [k,v] of Object.entries(opts.attrs)) e.setAttribute(k, v);
  children.forEach(c => e.appendChild(c));
  return e;
}

function clear(elm){ while (elm.firstChild) elm.removeChild(elm.firstChild); }

let spy = null;
let currentLang = 'en';

function render(lang){
  const DATA = CONTENT[lang];
  currentLang = lang;
  document.documentElement.lang = lang;
  document.getElementById('pageTitle').textContent = DATA.metaTitle;
  document.getElementById('pageDescription').setAttribute('content', DATA.metaDescription);

  // lang switch buttons
  document.querySelectorAll('#langSwitch button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });

  // nav
  const navEl = document.getElementById('nav');
  clear(navEl);
  DATA.nav.forEach(n => navEl.appendChild(el('a', { href: n.href, text: n.label })));

  // rail labels
  document.getElementById('railAbout').textContent = DATA.rail.about;
  document.getElementById('railStack').textContent = DATA.rail.stack;
  document.getElementById('railProjects').textContent = DATA.rail.projects;
  document.getElementById('railExperience').textContent = DATA.rail.experience;
  document.getElementById('railBackground').textContent = DATA.rail.background;
  document.getElementById('railContact').textContent = DATA.rail.contact;

  // hero
  document.getElementById('name').textContent = DATA.name;

  const meta = document.getElementById('metaLine');
  clear(meta);
  [DATA.role, DATA.location, DATA.experienceYears].forEach(t => {
    meta.appendChild(el('span', { text: t }));
  });

  document.getElementById('bio').textContent = DATA.bio;

  const statsEl = document.getElementById('stats');
  clear(statsEl);
  DATA.stats.forEach(s => {
    statsEl.appendChild(el('div', { class: 'stat' }, [
      el('b', { text: s.value }),
      el('span', { text: s.label })
    ]));
  });

  const ctaEl = document.getElementById('ctaRow');
  clear(ctaEl);
  ctaEl.appendChild(el('a', { class: 'btn btn--primary', href: DATA.primaryCta.url, text: DATA.primaryCta.label, attrs: { target: '_blank', rel: 'noopener' } }));
  ctaEl.appendChild(el('a', { class: 'btn btn--ghost', href: DATA.secondaryCta.url, text: DATA.secondaryCta.label }));
  ctaEl.appendChild(el('a', { class: 'btn btn--ghost', href: DATA.resumeCta.url, text: DATA.resumeCta.label, attrs: { download: DATA.resumeCta.filename } }));

  // stack
  document.getElementById('stackHeading').textContent = DATA.stackHeading;
  const skillWrap = document.getElementById('skillGroups');
  clear(skillWrap);
  DATA.skillGroups.forEach(g => {
    const chips = el('div', { class: 'chips' });
    g.items.forEach(item => chips.appendChild(el('span', { class: 'chip', text: item })));
    skillWrap.appendChild(el('div', { class: 'skill-group' }, [
      el('div', { class: 'skill-group-label', text: g.label }),
      chips
    ]));
  });

  // projects
  document.getElementById('projectsHeading').textContent = DATA.projectsHeading;
  document.getElementById('projectsIntro').textContent = DATA.projectsIntro;
  const projectGrid = document.getElementById('projectGrid');
  clear(projectGrid);
  DATA.projects.forEach(p => {
    const tools = el('div', { class: 'project-tools' });
    p.tools.forEach(t => tools.appendChild(el('span', { class: 'project-tool', text: t })));
    projectGrid.appendChild(el('a', { class: 'project-card', href: p.url, attrs: { target: '_blank', rel: 'noopener' } }, [
      el('div', { class: 'project-card-top' }, [
        el('p', { class: 'project-name', text: p.name }),
        el('span', { class: 'project-lang', text: p.lang })
      ]),
      tools,
      el('div', { class: 'project-link', text: DATA.projectLinkLabel })
    ]));
  });

  // experience
  document.getElementById('experienceHeading').textContent = DATA.experienceHeading;
  const expList = document.getElementById('expList');
  clear(expList);
  DATA.experience.forEach(job => {
    const ul = el('ul');
    job.bullets.forEach(b => ul.appendChild(el('li', { text: b })));
    const details = el('details', { class: 'exp-item', attrs: job.open ? { open: '' } : {} }, [
      el('summary', {}, [
        el('div', { class: 'exp-head-left' }, [
          el('p', { class: 'exp-company', text: job.company }),
          el('p', { class: 'exp-role', text: job.role })
        ]),
        el('div', { class: 'exp-period', text: job.period })
      ]),
      el('div', { class: 'exp-body' }, [ul])
    ]);
    expList.appendChild(details);
  });

  const expToggle = document.getElementById('expToggle');
  expToggle.textContent = DATA.expandLabel;
  expToggle.onclick = function(){
    const items = document.querySelectorAll('.exp-item');
    const anyClosed = [...items].some(i => !i.open);
    items.forEach(i => i.open = anyClosed);
    this.textContent = anyClosed ? CONTENT[currentLang].collapseLabel : CONTENT[currentLang].expandLabel;
  };

  // background
  document.getElementById('educationLabel').textContent = DATA.educationLabel;
  const eduEl = document.getElementById('education');
  clear(eduEl);
  DATA.education.forEach(e => {
    eduEl.appendChild(el('p', { text: e.title }));
    eduEl.appendChild(el('p', { class: 'sub', text: `${e.org} · ${e.period}` }));
  });

  document.getElementById('languagesLabel').textContent = DATA.languagesLabel;
  const langEl = document.getElementById('languages');
  clear(langEl);
  DATA.languages.forEach(l => {
    langEl.appendChild(el('p', { text: l.name }));
    langEl.appendChild(el('p', { class: 'sub', text: l.level }));
  });

  // contact
  document.getElementById('contactHeading').textContent = DATA.contactHeading;
  document.getElementById('contactIntro').textContent = DATA.contactIntro;
  const contactGrid = document.getElementById('contactGrid');
  clear(contactGrid);
  DATA.contacts.forEach(c => {
    contactGrid.appendChild(el('a', { class: 'contact-card', href: c.url, attrs: { target: '_blank', rel: 'noopener' } }, [
      el('span', { class: 'contact-card-label', text: c.label }),
      el('span', { class: 'contact-card-value', text: c.value })
    ]));
  });

  document.getElementById('footerText').textContent = `© ${new Date().getFullYear()} ${DATA.name}. ${DATA.footerNote}`;

  // scroll-spy nav (rebind — nav links are re-created per render)
  if (spy) spy.disconnect();
  const navLinks = [...document.querySelectorAll('#nav a')];
  const sections = navLinks.map(a => document.querySelector(a.getAttribute('href')));
  spy = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting){
        const id = '#' + entry.target.id;
        navLinks.forEach(a => a.classList.toggle('active', a.getAttribute('href') === id));
      }
    });
  }, { rootMargin: '-40% 0px -55% 0px' });
  sections.forEach(s => s && spy.observe(s));
}

function setLang(lang){
  try { localStorage.setItem('cvLang', lang); } catch (e) {}
  render(lang);
}

document.querySelectorAll('#langSwitch button').forEach(b => {
  b.addEventListener('click', () => setLang(b.dataset.lang));
});

let initialLang = 'en';
try {
  const saved = localStorage.getItem('cvLang');
  if (saved && CONTENT[saved]) {
    initialLang = saved;
  } else if (navigator.language && navigator.language.toLowerCase().startsWith('ru')) {
    initialLang = 'ru';
  }
} catch (e) {}

render(initialLang);
</script>
